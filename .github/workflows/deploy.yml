name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 8621 186.246.51.47 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Chown to www before upload
        run: |
          ssh -p 8621 www@186.246.51.47 "echo '${{ secrets.SUDO_PASS }}' | sudo -S chown -R www:www /var/www/nexiumdev"

      - name: Upload dist to server
        run: |
          scp -O -P 8621 -r dist/* www@186.246.51.47:/var/www/nexiumdev

      - name: Chown to www-data after upload
        run: |
          ssh -p 8621 www@186.246.51.47 "echo '${{ secrets.SUDO_PASS }}' | sudo -S chown -R www-data:www-data /var/www/nexiumdev"

      - name: Done
        run: echo "✅ Deployed successfully!"
